name: Split repositories

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "core-v*"
      - "laravel-v*"
      - "starter-v*"

  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_PROCESS_TIMEOUT: "0"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_AUDIT: "1"

# Do not allow two workflow runs to rewrite destination branches simultaneously.
concurrency:
  group: free-fire-split-repositories
  cancel-in-progress: false

jobs:
  verify:
    name: Verify monorepo

    if: github.repository == 'refatbd/free-fire-php-monorepo'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: openssl
          coverage: none

      - name: Install Protobuf compiler
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

          protoc --version

      - name: Resolve Composer dependencies
        shell: bash
        run: |
          set -euo pipefail

          composer update \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Generate Protobuf classes
        run: composer proto:generate

      - name: Refresh Composer autoloader
        run: composer dump-autoload --optimize

      - name: Run PHP lint
        run: composer lint

      - name: Run tests
        run: composer test
        env:
          REQUIRE_GENERATED_PROTO: "1"

      - name: Simulate repository splits
        run: bash tools/release/simulate_splits.sh

  split:
    name: Split ${{ matrix.kind }}

    needs:
      - verify

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - kind: core
            prefix: packages/core
            repository: free-fire-php
            tag_prefix: core-

          - kind: laravel
            prefix: packages/laravel
            repository: laravel-free-fire
            tag_prefix: laravel-

          - kind: starter
            prefix: apps/starter
            repository: free-fire-info-starter
            tag_prefix: starter-

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

          # Important:
          # Do not leave the built-in GITHUB_TOKEN in Git configuration.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: openssl
          coverage: none

      - name: Decide whether this package should publish
        id: release
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH="true"
          DESTINATION_TAG=""

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            SOURCE_TAG="$GITHUB_REF_NAME"

            if [[ "$SOURCE_TAG" == v* ]]; then
              # Example: v1.0.0
              # Publish all three packages with v1.0.0.
              DESTINATION_TAG="$SOURCE_TAG"

            elif [[ "$SOURCE_TAG" == "${{ matrix.tag_prefix }}"v* ]]; then
              # Examples:
              # core-v1.0.1    -> v1.0.1
              # laravel-v1.0.1 -> v1.0.1
              # starter-v1.0.1 -> v1.0.1
              DESTINATION_TAG="${SOURCE_TAG#${{ matrix.tag_prefix }}}"

            else
              # Package-specific tag does not belong to this matrix item.
              PUBLISH="false"
            fi
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "destination_tag=$DESTINATION_TAG" >> "$GITHUB_OUTPUT"

          echo "Package: ${{ matrix.kind }}"
          echo "Publish: $PUBLISH"
          echo "Destination tag: ${DESTINATION_TAG:-none}"

      - name: Verify SPLIT_TOKEN exists
        if: steps.release.outputs.publish == 'true'
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SPLIT_TOKEN:-}" ]]; then
            echo "::error::SPLIT_TOKEN is missing or empty."
            echo "::error::Open repository Settings > Secrets and variables > Actions."
            echo "::error::Create or update a repository secret named SPLIT_TOKEN."
            exit 1
          fi

          echo "SPLIT_TOKEN is available."

      - name: Remove checkout authentication headers
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Remove credentials potentially left by an older checkout setup.
          git config --local \
            --unset-all http.https://github.com/.extraheader \
            || true

          git config --global \
            --unset-all http.https://github.com/.extraheader \
            || true

          # Also remove any configured credential helper for this job.
          git config --local \
            --unset-all credential.helper \
            || true

      - name: Configure Git identity
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify destination repository write access
        if: steps.release.outputs.publish == 'true'
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          TARGET_OWNER: refatbd
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_FILE="$RUNNER_TEMP/${{ matrix.kind }}-repository.json"

          HTTP_STATUS=$(
            curl \
              --silent \
              --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${SPLIT_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_OWNER}/${{ matrix.repository }}"
          )

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::SPLIT_TOKEN could not access ${TARGET_OWNER}/${{ matrix.repository }}."
            echo "::error::GitHub API returned HTTP ${HTTP_STATUS}."
            echo "::error::Ensure this repository is selected in the fine-grained token."
            exit 1
          fi

          CAN_PUSH=$(
            php -r '
              $data = json_decode(
                  file_get_contents($argv[1]),
                  true,
                  512,
                  JSON_THROW_ON_ERROR
              );

              echo (($data["permissions"]["push"] ?? false) === true)
                  ? "true"
                  : "false";
            ' "$RESPONSE_FILE"
          )

          if [[ "$CAN_PUSH" != "true" ]]; then
            echo "::error::SPLIT_TOKEN cannot push to ${TARGET_OWNER}/${{ matrix.repository }}."
            echo "::error::Set token permission: Repository permissions > Contents > Read and write."
            exit 1
          fi

          echo "Write access confirmed for:"
          echo "${TARGET_OWNER}/${{ matrix.repository }}"

      - name: Build core distribution artifacts
        if: steps.release.outputs.publish == 'true' && matrix.kind == 'core'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

          php packages/core/tools/protobuf/generate.php

          git add -f packages/core/protocol/generated/php

          git commit \
            -m "Build generated Protobuf classes for core distribution" \
            || true

      - name: Prepare Laravel distribution manifest
        if: steps.release.outputs.publish == 'true' && matrix.kind == 'laravel'
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $file = 'packages/laravel/composer.json';

          if (!is_file($file)) {
              fwrite(STDERR, "Laravel composer.json was not found.\n");
              exit(1);
          }

          $contents = file_get_contents($file);

          if ($contents === false) {
              fwrite(STDERR, "Laravel composer.json could not be read.\n");
              exit(1);
          }

          $manifest = json_decode(
              $contents,
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          if (!isset($manifest['require']) || !is_array($manifest['require'])) {
              $manifest['require'] = [];
          }

          // Public Laravel package must use the published core package.
          $manifest['require']['refatbd/free-fire-php'] = '^1.0';

          $encoded = json_encode(
              $manifest,
              JSON_PRETTY_PRINT
              | JSON_UNESCAPED_SLASHES
              | JSON_THROW_ON_ERROR
          );

          if (file_put_contents($file, $encoded . PHP_EOL) === false) {
              fwrite(STDERR, "Laravel composer.json could not be written.\n");
              exit(1);
          }
          PHP

          git add packages/laravel/composer.json

          git commit \
            -m "Prepare Laravel package for public distribution" \
            || true

      - name: Prepare starter distribution manifest
        if: steps.release.outputs.publish == 'true' && matrix.kind == 'starter'
        shell: bash
        run: |
          set -euo pipefail

          php tools/release/prepare_starter_distribution.php \
            apps/starter

          git add apps/starter/composer.json

          git rm \
            -f \
            --ignore-unmatch \
            apps/starter/composer.lock

          git commit \
            -m "Prepare starter package for public distribution" \
            || true

      - name: Create and verify split tree
        if: steps.release.outputs.publish == 'true'
        id: split_tree
        shell: bash
        run: |
          set -euo pipefail

          SPLIT_SHA=$(
            git subtree split \
              --prefix="${{ matrix.prefix }}" \
              HEAD
          )

          if [[ -z "$SPLIT_SHA" ]]; then
            echo "::error::Failed to create the ${{ matrix.kind }} subtree."
            exit 1
          fi

          DISTRIBUTION_DIRECTORY="$RUNNER_TEMP/${{ matrix.kind }}-distribution"

          rm -rf "$DISTRIBUTION_DIRECTORY"
          mkdir -p "$DISTRIBUTION_DIRECTORY"

          git archive "$SPLIT_SHA" \
            | tar -x -C "$DISTRIBUTION_DIRECTORY"

          php tools/release/verify_split.php \
            "${{ matrix.kind }}" \
            "$DISTRIBUTION_DIRECTORY"

          (
            cd "$DISTRIBUTION_DIRECTORY"

            composer validate \
              --strict \
              --no-check-lock
          )

          if [[ "${{ matrix.kind }}" == "core" ]]; then
            (
              cd "$DISTRIBUTION_DIRECTORY"

              composer install \
                --no-dev \
                --no-interaction \
                --prefer-dist \
                --no-progress
            )

            php -r '
              require $argv[1];

              $class =
                  "Refatbd\\FreeFire\\Protocol\\Generated\\Ob54" .
                  "\\AccountPersonalShow\\AccountPersonalShowInfo";

              exit(class_exists($class) ? 0 : 1);
            ' "$DISTRIBUTION_DIRECTORY/vendor/autoload.php"
          fi

          echo "sha=$SPLIT_SHA" >> "$GITHUB_OUTPUT"

          echo "Created ${{ matrix.kind }} split commit:"
          echo "$SPLIT_SHA"

      - name: Push destination branch and immutable tag
        if: steps.release.outputs.publish == 'true'
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          TARGET_OWNER: refatbd
          DESTINATION_TAG: ${{ steps.release.outputs.destination_tag }}
          SPLIT_SHA: ${{ steps.split_tree.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SPLIT_TOKEN:-}" ]]; then
            echo "::error::SPLIT_TOKEN is missing or empty."
            exit 1
          fi

          if [[ -z "${SPLIT_SHA:-}" ]]; then
            echo "::error::The split commit SHA is missing."
            exit 1
          fi

          # Ensure the built-in github-actions[bot] token cannot override
          # the personal access token used below.
          git config --local \
            --unset-all http.https://github.com/.extraheader \
            || true

          git config --global \
            --unset-all http.https://github.com/.extraheader \
            || true

          REMOTE="https://${TARGET_OWNER}:${SPLIT_TOKEN}@github.com/${TARGET_OWNER}/${{ matrix.repository }}.git"

          echo "Publishing ${{ matrix.kind }} to:"
          echo "${TARGET_OWNER}/${{ matrix.repository }}"

          git push \
            --force \
            "$REMOTE" \
            "${SPLIT_SHA}:refs/heads/main"

          if [[ -n "$DESTINATION_TAG" ]]; then
            EXISTING_SHA=$(
              git ls-remote \
                "$REMOTE" \
                "refs/tags/${DESTINATION_TAG}" \
                | awk '{print $1}'
            )

            if [[ -n "$EXISTING_SHA" && "$EXISTING_SHA" != "$SPLIT_SHA" ]]; then
              echo "::error::Refusing to rewrite existing destination tag ${DESTINATION_TAG}."
              echo "::error::Existing SHA: ${EXISTING_SHA}"
              echo "::error::New SHA: ${SPLIT_SHA}"
              exit 1
            fi

            if [[ -z "$EXISTING_SHA" ]]; then
              git push \
                "$REMOTE" \
                "${SPLIT_SHA}:refs/tags/${DESTINATION_TAG}"

              echo "Created destination tag:"
              echo "$DESTINATION_TAG"
            else
              echo "Destination tag already points to the correct commit."
            fi
          fi

          echo "Successfully published ${{ matrix.kind }}."
